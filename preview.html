<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-x: hidden;
        }
.preview-nav {
    height: 58px;
    padding: 0 35px !important;
    position: relative;
    z-index: 1000;
}

@media (max-width: 991px) {

    .preview-nav {
        height: 58px;
        padding: 0 15px !important;
    }

    .preview-nav .navbar-collapse {
        position: absolute;
        top: 58px;
        left: 0;
        width: 100%;
        background-color: #0d1b2a;
        padding: 10px 15px;
        z-index: 1000;
    }

}
        .preview-section {
            height: calc(100vh - 116px);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #carouselExampleControls {
            width: 100%;
            height: 100%;
        }

        .carousel-inner {
            height: 100%;
        }
        .carousel-item {
            height: 100%;
        }

        .preview-image {
            width: 800px;
            height: calc(100vh - 160px);
            object-fit: cover;
            margin: auto;
        }
         .preview-footer {
            height: 58px;
        }

        .preview-footer .container {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
        }
        .preview-footer .copyright {
    margin: 0;
}

/* Back to top - right corner */
.preview-footer .back-to-top {
    position: absolute;
    right: 15px;
    margin: 0;
}
        .carousel-control-prev-icon {
            background-image: none;
        }

        .carousel-control-prev-icon::after {
            content: "‹";
            font-size: 50px;
            color: black;
            font-weight: bold;
        }

        .carousel-control-next-icon {
            background-image: none;
        }

        .carousel-control-next-icon::after {
            content: "›";
            font-size: 50px;
            color: black;
            font-weight: bold;
        }
        
        /* MOBILE */

        @media (max-width: 576px) {

            .preview-nav {
                height: 58px;
                padding: 0 15px !important;
            }

            .preview-section {
                height: calc(100vh - 116px);
            }

            .preview-image {
                width: 90%;
                height: calc(100vh - 160px);
                object-fit: cover;
            }

            .preview-footer {
                height: 58px;
            }

        }

    </style>

    <title>Preview - Gallery</title>

</head>


<body>
    <nav class="navbar navbar-expand-lg navbar-dark preview-nav"
     style="background-color: #0d1b2a;">

    <a class="navbar-brand" href="index.html">
        Gallery
    </a>

    <button class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav mr-auto">

            <li class="nav-item">
                <a class="nav-link" href="index.html">
                    Home
                </a>
            </li>

            <li class="nav-item active">
                <a class="nav-link" href="preview.html">
                    Preview
                </a>
            </li>

        </ul>

    </div>

</nav>

    

    <div class="preview-section">

        <div id="carouselExampleControls"
             class="carousel slide"
             data-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="1.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 1">
                </div>
                <div class="carousel-item">
                    <img src="2.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 2">
                </div>
                <div class="carousel-item">
                    <img src="3.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 3">
                </div>
                <div class="carousel-item">
                    <img src="4.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 4">
                </div>
                <div class="carousel-item">
                    <img src="5.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 5">
                </div>
                <div class="carousel-item">
                    <img src="6.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 6">
                </div>
                <div class="carousel-item">
                    <img src="7.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 7">
                </div>
                <div class="carousel-item">
                    <img src="8.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 8">
                </div>
                <div class="carousel-item">
                    <img src="9.jpg"
                         class="d-block mx-auto preview-image"
                         alt="Image 9">
                </div>
            </div>

            <a class="carousel-control-prev"
               href="#carouselExampleControls"
               role="button"
               data-slide="prev">

                <span class="carousel-control-prev-icon"></span>

                <span class="sr-only">
                    Previous
                </span>

            </a>
            
            
            <a class="carousel-control-next"
               href="#carouselExampleControls"
               role="button"
               data-slide="next">

                <span class="carousel-control-next-icon"></span>
                <span class="sr-only">
                    Next
                </span>
            </a>
        </div>
    </div>

    <footer class="bg-dark text-white preview-footer">

    <div class="container">

        <p class="copyright">
            © 2020-2021 Gallery, Inc.
        </p>

        <p class="back-to-top">
            <a href="#" class="text-white">
                Back to top
            </a>
        </p>

    </div>

</footer>

 <!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<!-- Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
